<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Left Panel: Title, Leaderboard, Instructions -->
        <div class="left-panel">
            <h1>TETRIS</h1>
            <!-- Leaderboard -->
            <div id="leaderboard-container" class="info-box">
                <h2>HIGH SCORES</h2>
                <ol id="leaderboard"></ol>
            </div>
            <p class="instructions">
                Use arrow keys to move and rotate the pieces.
                <br><br>
                &larr; &rarr; : Move | &uarr; : Rotate | &darr; : Drop | Space : Hard Drop
            </p>
        </div>

        <!-- Center Panel: Game Board -->
        <canvas id="game-board"></canvas>

        <!-- Right Panel: Score, Next Piece, Controls -->
        <div class="right-panel">
            <div class="info-box">
                <h2>SCORE</h2>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h2>NEXT</h2>
                <canvas id="next-piece"></canvas>
            </div>
            <button id="pause-button">PAUSE</button>
            <button id="start-button">START GAME</button>
            <button id="sound-toggle-button">SOUND FX: ON</button>
        </div>
    </div>

    <!-- High Score Input Modal -->
    <div id="highscore-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>New High Score!</h2>
            <p>You made it into the top 10!</p>
            <form id="highscore-form">
                <label for="initials">Enter your initials (3 chars):</label>
                <input type="text" id="initials" maxlength="3" required>
                <button type="submit">SAVE</button>
            </form>
        </div>
    </div>

    <!-- Load Scripts -->
    <script src="main.js" type="module"></script>
</body>
</html>
